[project]
name = "aegisdrive-ai"
version = "0.1.0"
description = "AEGISDRIVE AI inference gateway"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
# Heavy native runtimes are opt-in. The gateway boots, serves its health probe
# and validates its contract without them, which keeps CI fast and keeps a
# developer from needing CUDA to run the API locally.
inference = [
    "onnxruntime>=1.20.0",
    "numpy>=2.1.0",
]
vision = [
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
]
training = [
    "tensorflow>=2.18.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.hatch.build.targets.wheel]
# The project is named `aegisdrive-ai`, which hatchling normalises to
# `aegisdrive_ai` and expects as a directory at the project root. The actual
# package is `app/`, so the default file-selection heuristic finds nothing to
# ship and fails the editable install this CI job depends on.
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
