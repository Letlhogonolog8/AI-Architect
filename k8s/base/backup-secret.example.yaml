# Same pattern as secret.example.yaml: documents the keys
# k8s/base/backup-cronjob.yaml expects in `aegisdrive-backup-secrets`, not
# applied by kustomization.yaml. Populate through External Secrets Operator or
# a one-time `kubectl create secret generic` — see k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: aegisdrive-backup-secrets
type: Opaque
stringData:
  # Direct to Postgres, never through PgBouncer — see infra/docker/backup.sh's
  # own comment on why transaction pooling and pg_dump do not mix. A
  # read-replica connection string is even better, if one exists, so the
  # dump's snapshot never competes with primary traffic.
  BACKUP_DATABASE_URL: 'postgresql://backup_user:password@postgres-primary:5432/aegisdrive'
  BACKUP_REMOTE: 's3:my-backup-bucket/aegisdrive'
  BACKUP_RETENTION_DAYS: '30'
  # rclone's own config format — one [remote] section matching the scheme used
  # in BACKUP_REMOTE above (here, `s3:`). See https://rclone.org/s3/ for the
  # equivalent block for GCS, Azure Blob, or any other provider.
  rclone.conf: |
    [s3]
    type = s3
    provider = AWS
    access_key_id = replace-with-a-real-key
    secret_access_key = replace-with-a-real-secret
    region = us-east-1
