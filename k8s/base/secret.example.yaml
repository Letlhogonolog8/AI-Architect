# NOT applied by kustomization.yaml — this file documents the keys the API and
# workers expect in the `aegisdrive-secrets` Secret. It is intentionally kept
# out of the resource list so `kubectl apply -k` can never accidentally create
# a Secret full of placeholder values that looks real.
#
# Populate the real Secret with one of:
#   - the External Secrets Operator, syncing from your cloud secret manager
#     (recommended — see k8s/README.md for an ExternalSecret example)
#   - `kubectl create secret generic aegisdrive-secrets --from-literal=...`
#     run by a human or a CI job with access to the vault, never committed
#
# Generate JWT secrets with: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: aegisdrive-secrets
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://user:password@pgbouncer:6432/aegisdrive?schema=public&pgbouncer=true&connection_limit=10'
  REDIS_URL: 'rediss://:password@redis:6379'
  JWT_ACCESS_SECRET: 'replace-with-openssl-rand-base64-48-output'
  JWT_REFRESH_SECRET: 'replace-with-a-different-openssl-rand-base64-48-output'
  INTERNAL_SERVICE_TOKEN: 'replace-with-a-32-plus-character-shared-secret'
