apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aegisdrive

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - web-deployment.yaml
  - workers-deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/aegisdrive/api
    newTag: latest
  - name: ghcr.io/aegisdrive/web
    newTag: latest
  - name: ghcr.io/aegisdrive/notifications-worker
    newTag: latest
  - name: ghcr.io/aegisdrive/telemetry-worker
    newTag: latest
  - name: ghcr.io/aegisdrive/evidence-worker
    newTag: latest
  - name: ghcr.io/aegisdrive/postgres-backup
    newTag: latest
