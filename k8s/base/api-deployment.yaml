apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: aegisdrive
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One extra pod during a rollout, zero unavailable: the realtime layer
      # needs the outgoing replica to keep serving until the new one is ready,
      # not be torn down first. See docs/runbook.md's deployment order.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: aegisdrive
      annotations:
        # Forces a pod restart when the ConfigMap changes, since Kubernetes does
        # not do this on its own — a `kubectl apply` to the ConfigMap alone would
        # otherwise leave every running pod on the old values indefinitely.
        checksum/config: 'placeholder-set-by-ci'
    spec:
      serviceAccountName: aegisdrive-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The API depends on the datastores being reachable before it can serve a
      # ready check; that dependency is enforced by the readiness probe below
      # rather than an initContainer, since Prisma migrations are a separate
      # deploy step (docs/runbook.md) that must not race a replica's own start.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/aegisdrive/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: aegisdrive-config
            - secretRef:
                name: aegisdrive-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          # Liveness never touches a dependency (docs/runbook.md) — it only
          # proves the event loop is alive, so a slow database never causes a
          # kill-and-restart loop that makes an outage worse.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              # Gives the load balancer time to stop sending new connections
              # before SIGTERM starts the graceful shutdown in src/index.ts.
              exec:
                command: ['sh', '-c', 'sleep 5']
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api
                topologyKey: kubernetes.io/hostname
