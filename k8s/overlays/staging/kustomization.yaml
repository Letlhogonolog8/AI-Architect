apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aegisdrive-staging

resources:
  - ../../base

patches:
  - path: replicas-patch.yaml
  - path: config-patch.yaml
  - path: ingress-patch.yaml

images:
  # CI resolves these to the commit SHA it just built for every push to main —
  # see .github/workflows/release.yml. `edge` is only the placeholder before
  # a first real deploy.
  - name: ghcr.io/aegisdrive/api
    newTag: edge
  - name: ghcr.io/aegisdrive/web
    newTag: edge
  - name: ghcr.io/aegisdrive/notifications-worker
    newTag: edge
  - name: ghcr.io/aegisdrive/telemetry-worker
    newTag: edge
  - name: ghcr.io/aegisdrive/evidence-worker
    newTag: edge
