server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never disclose the server version.
  server_tokens off;

  # Security headers. The CSP lives here rather than on the API because this is
  # the only origin that serves HTML — declaring it in two places guarantees
  # they drift.
  #
  # `'unsafe-inline'` on style-src is required by Framer Motion, which sets
  # inline styles for animated properties. script-src carries no such
  # exception, which is the one that matters.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
  # Mirrors the API's own HSTS setting (src/middleware/security.middleware.ts)
  # so both origins carry the same policy. Unconditional rather than gated on
  # an environment flag, unlike the API's: Chrome and Firefox both special-case
  # `localhost` to never enforce HSTS regardless of this header, so it is a
  # no-op for `docker compose --profile full`'s http://localhost:8080 and a
  # real control everywhere this image is actually served over HTTPS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached: it is what points at the current asset
  # hashes, and a stale copy pins users to a deleted bundle after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # Client-side routing: every unmatched path is handed to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
