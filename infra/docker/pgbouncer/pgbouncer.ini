; Self-hosted PgBouncer, for when the managed Postgres provider has no native
; pooler (RDS Proxy, Cloud SQL's built-in pooling, Aiven's PgBouncer add-on —
; see docs/postgres-optimization.md for why those are the first choice).
;
; transaction pooling, not session: a connection is only checked out for the
; duration of one transaction, which is what lets a handful of real Postgres
; connections serve far more concurrent API replicas than `max_connections`
; alone would allow. This is also *why* DATABASE_URL must carry
; `pgbouncer=true` — see the connection string note in
; docs/postgres-optimization.md — transaction mode cannot support session-
; scoped prepared statements, which Prisma otherwise uses by default.
[databases]
aegisdrive = host=postgres port=5432 dbname=aegisdrive

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction

; Real Postgres credentials are never in this file. auth_query delegates the
; password check to Postgres itself via a SECURITY DEFINER function — see
; generate-auth-function.sql — so there is no separate userlist.txt to keep in
; sync with the real password when it rotates.
auth_type = scram-sha-256
auth_query = SELECT usename, passwd FROM public.pgbouncer_auth_lookup($1)
auth_user = pgbouncer_auth

; Sized for a production API at k8s/overlays/production's HPA ceiling
; (maxReplicas: 20) plus the three single/double-replica workers, each
; opening a small Prisma pool (see DATABASE_URL's connection_limit param).
; Recompute this whenever either ceiling changes — see the worksheet in
; docs/postgres-optimization.md.
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Closes a client connection that has been idle mid-transaction — almost
; always a bug (a forgotten COMMIT/ROLLBACK) rather than legitimate traffic,
; and left alone it pins a real backend connection for nothing.
idle_transaction_timeout = 60

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; PgBouncer's own admin console, reachable only from inside the pod — never
; expose 6432's `pgbouncer` virtual database beyond the cluster network.
admin_users = pgbouncer_admin
